---
# 02-deploy.yaml
#
# Deploys federation-autoscaler on top of the bootstrap state:
#
#   1. Broker on central (with cert SAN extended to central's IP +
#      Service flipped to NodePort 30443).
#   2. CA Secret + Issuer mirrored from central to every agent cluster.
#   3. Consumer agent + grpc-server on each consumer; provider agent on
#      each provider; per-cluster identity stamped on the agent cert.
#   4. Cluster Autoscaler on each consumer.
#
# Order matters: PKI must be in place before the agents start, agents
# must be up before CA dials the gRPC server.

# Re-sync each cluster's kubeconfig from the live node using the current
# inventory IP, so a changed VM IP (with the inventory updated) doesn't
# make every kubectl call below hang dialing the old address. Same task
# the bootstrap uses; safe no-op when nothing changed.
- name: Refresh kubeconfigs from live nodes (handles changed VM IPs)
  hosts: all
  gather_facts: false
  become: false
  tasks:
    - name: Re-fetch {{ cluster_id }} kubeconfig with its current inventory IP
      ansible.builtin.include_role:
        name: k3s_install
        tasks_from: fetch_kubeconfig

# Re-apply the CRDs on every redeploy, not only at bootstrap: a release that
# adds a field to a CRD would otherwise run against the old schema, and the API
# server silently drops the new field (e.g. ResourceRequest.spec.userPrompt).
# `kubectl apply` is idempotent, so an unchanged CRD is a no-op.
- name: Apply federation-autoscaler CRDs on every cluster
  hosts: central:consumers:providers
  gather_facts: false
  become: false
  roles:
    - fa_crds

- name: Deploy broker on central
  hosts: central
  gather_facts: false
  become: false
  roles:
    - fa_central

- name: Deploy mock services on the mock cluster (eco/latency strategies)
  # Optional: only runs when the inventory defines a `mocks` group. With no such
  # group this play matches no hosts and is skipped, leaving eco/latency inert.
  hosts: mocks
  gather_facts: false
  become: false
  roles:
    - fa_mocks

- name: Mirror broker PKI to agent clusters
  hosts: consumers:providers
  gather_facts: false
  become: false
  roles:
    - fa_pki_mirror

- name: Local AI on each consumer with KubeAI (only with fa_kubeai)
  hosts: consumers
  gather_facts: false
  become: false
  roles:
    - role: fa_kubeai
      when: fa_kubeai | bool

- name: Deploy consumer agent + grpc-server
  hosts: consumers
  gather_facts: false
  become: false
  roles:
    - fa_consumer

- name: Deploy the region orchestrator (M3) on providers with fa_region_orchestrator
  hosts: providers
  gather_facts: false
  become: false
  roles:
    - fa_region

- name: Deploy provider agent
  hosts: providers
  gather_facts: false
  become: false
  roles:
    - fa_provider

- name: Stamp per-cluster identity on the agent cert (+ rollout)
  hosts: consumers:providers
  gather_facts: false
  become: false
  roles:
    - fa_identity_stamp

- name: Deploy Cluster Autoscaler on consumers
  hosts: consumers
  gather_facts: false
  become: false
  roles:
    - cluster_autoscaler

- name: Deploy the Liqo dashboard on consumers (Helm; image tag main)
  hosts: consumers
  gather_facts: false
  become: false
  roles:
    - liqo_dashboard
