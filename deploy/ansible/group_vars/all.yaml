---
# Shared variables for every cluster in the inventory.

# -----------------------------------------------------------------------------
# Image distribution
# -----------------------------------------------------------------------------

# The Docker Hub repo namespace where federation-autoscaler images live.
# Combined with `fa_tag` to form the full pull coordinate, e.g.:
#   docker.io/kazem26/federation-autoscaler-broker:v0.1.0
# Push the images once with `make docker-push REGISTRY=docker.io/kazem26 TAG=…`
# from the repo root; this playbook only references them.
#
# `fa_tag` is the default image tag. Override it per run without editing this
# file: `demo-up.sh --tag <tag>` or `ansible-playbook … -e fa_tag=<tag>`.
fa_registry: docker.io/kazem26
fa_tag: v0.1

# Resolved by Ansible's templating; do not edit directly.
fa_image_broker:      "{{ fa_registry }}/federation-autoscaler-broker:{{ fa_tag }}"
fa_image_agent:       "{{ fa_registry }}/federation-autoscaler-agent:{{ fa_tag }}"
fa_image_grpc_server: "{{ fa_registry }}/federation-autoscaler-grpc-server:{{ fa_tag }}"
fa_image_mock_eco:    "{{ fa_registry }}/federation-autoscaler-mock-eco:{{ fa_tag }}"
fa_image_mock_geo:    "{{ fa_registry }}/federation-autoscaler-mock-geo:{{ fa_tag }}"

# -----------------------------------------------------------------------------
# Mock services (eco / latency placement strategies) — option A: a dedicated
# mock "cluster", an OPTIONAL extra host in the `mocks` inventory group. When
# that group is absent these resolve to empty strings and the agents advertise
# no carbon / no coordinates, so the eco/latency strategies are simply inert
# (Price and the default no-policy behaviour are completely unaffected).
fa_mock_eco_node_port: 30081
fa_mock_geo_node_port: 30080

# The mock cluster's reachable address (first host in the `mocks` group), or ""
# when no such group exists.
fa_mock_address: "{{ hostvars[groups['mocks'][0]].ansible_host if (groups['mocks'] is defined and (groups['mocks'] | length) > 0) else '' }}"

# Full URLs the agents are pointed at (patched into agent-config). Empty when
# there is no mock cluster.
fa_mock_eco_url: "{{ ('http://' + fa_mock_address + ':' + (fa_mock_eco_node_port | string)) if fa_mock_address else '' }}"
fa_mock_geo_url: "{{ ('http://' + fa_mock_address + ':' + (fa_mock_geo_node_port | string)) if fa_mock_address else '' }}"

# ConsumerChoice LLM for consumer agents (patched into agent-config). Set
# fa_ollama_url to an Ollama server the consumer agents can reach to let a
# ConsumerChoice policy ask the LLM; empty ⇒ ConsumerChoice uses its
# deterministic fallback. fa_ollama_timeout bounds one LLM call.
fa_ollama_url: ""
fa_ollama_model: "phi4-mini:3.8b"
fa_ollama_timeout: "120s"
# The API the AI server speaks: "ollama" (Ollama's own API) or "openai"
# (OpenAI-style, served by Ollama, vLLM and KubeAI; the URL may end in /v1).
fa_llm_api: "openai"
# What the AI does for a plain-language request: "rank" (the model ranks the
# providers) or "fields" (the model only reads the text; code ranks).
fa_ai_job: "fields"

# The consumer's AI on its own cluster (roadmap step 24): with fa_kubeai true,
# the fa_kubeai role installs KubeAI and one model on each consumer and the
# consumer agent uses it (this replaces fa_ollama_url / fa_ollama_model and
# forces the OpenAI-style API). Engine: vLLM with a GPU, Ollama on CPU
# (fa_kubeai_engine auto | ollama | vllm). Chosen on the lab benchmark
# (federation-tests/aibench, 20 Nov 2026): phi4-mini, 2.5 GB; a smaller
# alternative is granite4.2:3b. KubeAI caches model files only for vLLM, so an
# Ollama pod downloads its model when it starts.
fa_kubeai: false
fa_kubeai_chart_version: "0.25.1"
fa_kubeai_namespace: "kubeai"
fa_kubeai_model_name: "phi4-mini"
fa_kubeai_ollama_model: "phi4-mini:3.8b"
fa_kubeai_hf_model: "microsoft/Phi-4-mini-instruct"
fa_kubeai_engine: "auto"
fa_kubeai_ollama_image: "ollama/ollama:0.40.15"
# What each model copy reserves on CPU: fa_kubeai_cpus and fa_kubeai_memory,
# set separately (the phi4-mini pod used about 4 GiB on the lab). One copy by default: a small consumer (the lab's
# 4 vCPU, 8 GiB) has no room for a second one, and KubeAI also needs room for
# a second pod to roll out a model change (otherwise delete the old pod).
# Raise fa_kubeai_max_replicas on a bigger consumer to scale with load.
fa_kubeai_cpus: 2
fa_kubeai_memory: "4Gi"
fa_kubeai_gpus: 1   # per copy, with vLLM only
fa_kubeai_min_replicas: 1
fa_kubeai_max_replicas: 1

# Who makes each consumer's placement decision: "central" (the Broker, today's
# behaviour) or "local" (the consumer's own brain, reading the Redis catalog at
# fa_catalog_addr; booking still goes through the Broker). Override per
# consumer host in the inventory, e.g. `fa_brain: local` on one consumer only.
fa_brain: "central"

# -----------------------------------------------------------------------------
# Software versions
# -----------------------------------------------------------------------------

k3s_version:          v1.32.5+k3s1
cert_manager_version: v1.18.0
liqo_version:         v1.1.2

# -----------------------------------------------------------------------------
# Repo layout (used by tasks that apply kustomize overlays from the
# control host's checkout of federation-autoscaler).
# -----------------------------------------------------------------------------

# Absolute path to the federation-autoscaler repo on the control host.
# playbook_dir is deploy/ansible/playbooks/, so three levels up is the
# repo root (deploy/ansible/playbooks/ → deploy/ansible/ → deploy/ →
# repo root).
fa_repo_root: "{{ playbook_dir }}/../../.."

# All cluster components share this namespace.
fa_namespace: federation-autoscaler-system

# -----------------------------------------------------------------------------
# Broker exposure
# -----------------------------------------------------------------------------

# How agents reach the broker. With no DNS / no public IPs in your network,
# we expose the broker as a NodePort on the central host's private IP and
# put that IP in the broker certificate's SAN list.
broker_node_port: 30443

# Read-only web dashboard NodePort (plain HTTP, no mTLS). Open
# http://{{ broker_address }}:{{ dashboard_node_port }}/ in a browser for a
# live view of broker state. Trusted-network only — it is unauthenticated.
dashboard_node_port: 30444

# Resolved from the inventory: the central host's ansible_host IP. Agents
# dial https://{{ broker_address }}:{{ broker_node_port }}/.
broker_address: "{{ hostvars[groups['central'][0]].ansible_host }}"

# The broker an agent talks to. Default: the central broker. Override per
# consumer host to point it at a region orchestrator (M3) instead, e.g.
#   consumer-2: { ..., fa_broker_url: "https://<region host IP>:30443" }
fa_broker_url: "https://{{ broker_address }}:{{ broker_node_port }}"

# -----------------------------------------------------------------------------
# Region orchestrator (M3, optional)
# -----------------------------------------------------------------------------

# Set per provider host: fa_region_orchestrator: true deploys the broker's
# logic for that region (config/broker-region) in the provider's own cluster,
# reachable at https://<its host IP>:{{ fa_region_node_port }}; its provider
# agent then advertises there, not to the central broker. Off by default.
fa_region_orchestrator: false

# NodePort of a region orchestrator on its provider host.
fa_region_node_port: 30443

# Where to drop the fetched kubeconfigs on the control host. Each cluster
# gets ~/.kube/<cluster_id>.yaml. These are what `kubectl --kubeconfig`
# expects during the demo's scale-up / scale-down narration.
kubeconfig_dir: "{{ lookup('env', 'HOME') }}/.kube"

# -----------------------------------------------------------------------------
# Offer catalog (optional, demo)
# -----------------------------------------------------------------------------

# When true, the central deploy also runs a plain Redis (no TLS, no accounts;
# demo only) and points the broker at it with --catalog-addr. Off by default so
# existing deploys are unchanged.
fa_catalog: false

# NodePort of the catalog Redis on the central host.
fa_catalog_node_port: 30379

# Address the consumer clusters (and the providers, with fa_catalog_provider_write)
# use to reach the catalog Redis.
fa_catalog_addr: "{{ broker_address }}:{{ fa_catalog_node_port }}"

# When true (and fa_catalog is true), each provider writes its own offer to the
# catalog Redis and the broker stops writing offers (--catalog-write=false).
# Off by default: the broker writes the offers, exactly as before.
fa_catalog_provider_write: false
