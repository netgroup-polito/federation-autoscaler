# Region orchestrator overlay (M3): the broker's logic for ONE region, deployed
# in that region's (provider) cluster, next to its provider agent. Consumers
# book here directly; the provider agent advertises here and writes the
# region's offer to the shared catalog.
#
# Same broker as ../broker, minus its own PKI: a region must not mint a new
# root CA. Its server certificate is issued by federation-autoscaler-ca-issuer,
# the federation CA mirrored from the central cluster (Ansible role
# fa_pki_mirror), so consumers and the provider agent trust it, and it trusts
# their client certificates.
#
# Edge sites: the broker places each booking on one edge site, named by the
# node label federation-autoscaler.io/site, and pins the consumer's slice to it
# (--site-label). Label the region's nodes with their site (Ansible:
# fa_edge_sites). Use neutral site IDs (e.g. "s1"): the consumer's virtual node
# carries the selector, so its value is visible to the consumer's cluster.
#
# Duration: a booking lasts its own durationSeconds; without one it is
# permanent here (--reservation-timeout=0, appended after the base's 24h; the
# last value wins).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../broker
- clusterrole-sites.yaml

patches:
- patch: |-
    $patch: delete
    apiVersion: cert-manager.io/v1
    kind: Issuer
    metadata:
      name: selfsigned-root
      namespace: federation-autoscaler-system
- patch: |-
    $patch: delete
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: federation-autoscaler-ca
      namespace: federation-autoscaler-system
- patch: |-
    $patch: delete
    apiVersion: cert-manager.io/v1
    kind: Issuer
    metadata:
      name: federation-autoscaler-ca-issuer
      namespace: federation-autoscaler-system
- target:
    kind: Deployment
    name: broker
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --site-label=federation-autoscaler.io/site
- target:
    kind: Deployment
    name: broker
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --reservation-timeout=0
