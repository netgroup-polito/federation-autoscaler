# Offer catalog Redis (demo).
#
# Plain Redis for the demo only: no TLS, no accounts, no persistence. Offers
# expire by themselves (TTL), so losing the data on a restart is fine: the
# providers write their offers again within 30 s. TLS plus accounts follow.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-redis
  namespace: federation-autoscaler-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: federation-autoscaler
      app.kubernetes.io/component: catalog-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: federation-autoscaler
        app.kubernetes.io/component: catalog-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        image: redis:7
        args:
        - --save
        - ""
        - --appendonly
        - "no"
        - --protected-mode
        - "no"
        ports:
        - name: redis
          containerPort: 6379
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}
