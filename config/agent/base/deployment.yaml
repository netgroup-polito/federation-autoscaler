# Agent Deployment.
#
# Single replica + strategy: Recreate is load-bearing: two agents polling
# concurrently would break the broker's CRD-backed idempotency (same
# X-Reservation-Id → same Reservation, same instruction id → same enforcement
# bit). See CLAUDE.md ("Conventions worth knowing") and docs/design.md §4.4.
#
# --role is intentionally not set in the base; the consumer/ and provider/
# overlays each layer a JSON-patch that appends the right value.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: federation-autoscaler-system
  labels:
    app.kubernetes.io/name: federation-autoscaler
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: federation-autoscaler
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: federation-autoscaler
        app.kubernetes.io/component: agent
      annotations:
        kubectl.kubernetes.io/default-container: agent
    spec:
      serviceAccountName: agent
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: agent
        image: federation-autoscaler/agent:latest
        imagePullPolicy: IfNotPresent
        args:
        - --cluster-id=$(CLUSTER_ID)
        - --liqo-cluster-id=$(LIQO_CLUSTER_ID)
        - --broker-url=$(BROKER_URL)
        - --client-cert=/etc/federation-autoscaler/tls/tls.crt
        - --client-key=/etc/federation-autoscaler/tls/tls.key
        - --broker-ca=/etc/federation-autoscaler/tls/ca.crt
        - --health-probe-bind-address=:8081
        # Timing knobs, env-backed so they can be retuned with
        # `kubectl set env deploy/agent FA_POLL_INTERVAL=2s` — which rolls the
        # Deployment automatically — instead of editing args and redeploying.
        #
        # --poll-interval is the dominant latency knob: a work order waits on
        # average half of it before an agent picks it up, and a cold scale-up
        # pays that twice (provider hop, then consumer hop).
        #
        # The heartbeat and advertisement cadences also size the readiness
        # window (2x and 3x respectively). Raising FA_ADVERTISEMENT_INTERVAL
        # above 30s additionally needs the Broker's 90s advertisement-staleness
        # threshold raised, or providers flip unavailable between publishes.
        - --poll-interval=$(FA_POLL_INTERVAL)
        - --heartbeat-interval=$(FA_HEARTBEAT_INTERVAL)
        - --advertisement-interval=$(FA_ADVERTISEMENT_INTERVAL)
        # Sub-second log timestamps. zap's dev encoder writes whole seconds by
        # default, which is coarser than the phases being measured — at the
        # tuned 1 s poll this agent's contribution to a scale-up is 0-1 s, and
        # the steps around `liqoctl peer` are milliseconds. The harness merges these
        # lines with the broker's to reconstruct the scale-up / scale-down
        # timeline, so the resolution has to beat the thing being timed.
        - --zap-time-encoding=rfc3339nano
        # Pin the consumer agent's resources (VirtualNodeState, Liqo
        # ResourceSlice, kubeconfig Secret) to the agent's own namespace
        # rather than the binary default — keeps federation-autoscaler
        # CRs out of the liqo namespace.
        - --namespace=$(POD_NAMESPACE)
        # Location + mock-service wiring for the eco/latency placement strategies.
        # Location is AUTO-DISCOVERED: the agent reads its own node IP (NODE_NAME
        # downward API) and geolocates it via --mock-geo-url. --advertised-ip is an
        # optional override (demo/steering lever). (--mock-eco-url is provider-only
        # and appended by the provider overlay.) All are no-ops when the URL is
        # empty / no node IP is resolvable.
        - --advertised-ip=$(ADVERTISED_IP)
        - --mock-geo-url=$(MOCK_GEO_URL)
        # --role and (for consumer) --local-api-bind-address are appended
        # by the per-role overlays.
        env:
        # Defaults match the binary's own flag defaults; override per cluster
        # with `kubectl set env deploy/agent FA_POLL_INTERVAL=…`.
        - name: FA_POLL_INTERVAL
          value: "1s"
        - name: FA_HEARTBEAT_INTERVAL
          value: "15s"
        - name: FA_ADVERTISEMENT_INTERVAL
          value: "30s"
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # The node this pod runs on — its IP is auto-discovered and geolocated for
        # the eco/latency strategies (--advertised-ip overrides it).
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: CLUSTER_ID
          valueFrom:
            configMapKeyRef:
              name: agent-config
              key: clusterId
        - name: LIQO_CLUSTER_ID
          valueFrom:
            configMapKeyRef:
              name: agent-config
              key: liqoClusterId
        - name: BROKER_URL
          valueFrom:
            configMapKeyRef:
              name: agent-config
              key: brokerUrl
        - name: MOCK_ECO_URL
          valueFrom:
            configMapKeyRef:
              name: agent-config
              key: mockEcoUrl
        - name: ECO_CACHE_TTL
          valueFrom:
            configMapKeyRef:
              name: agent-config
              key: ecoCacheTtl
        - name: MOCK_GEO_URL
          valueFrom:
            configMapKeyRef:
              name: agent-config
              key: mockGeoUrl
        # Optional --advertised-ip override (demo/steering lever); empty by default
        # so the agent auto-discovers its node IP.
        - name: ADVERTISED_IP
          valueFrom:
            configMapKeyRef:
              name: agent-config
              key: advertisedIp
        ports:
        - name: health
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tls
          mountPath: /etc/federation-autoscaler/tls
          readOnly: true
        - name: liqoctl-cache
          mountPath: /home/nonroot/.kube
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tls
        secret:
          secretName: agent-client-cert
          # 0444 — see config/broker/deployment.yaml for the rationale.
          defaultMode: 0444
      - name: liqoctl-cache
        emptyDir: {}
      # liqoctl writes the staged kubeconfig under /tmp on the consumer side,
      # and Go's os.MkdirTemp falls back to /tmp too — give it an emptyDir so
      # readOnlyRootFilesystem doesn't break those writes.
      - name: tmp
        emptyDir: {}
