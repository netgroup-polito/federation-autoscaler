# Consumer-role patches:
#  - append --role=consumer
#  - append --local-api-bind-address=0.0.0.0:9090 so the co-located gRPC
#    server can reach the loopback REST API via the agent Service (the
#    binary's default is 127.0.0.1, loopback-only, which the gRPC server
#    pod cannot dial).
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --role=consumer
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --local-api-bind-address=0.0.0.0:9090
- op: add
  path: /spec/template/spec/containers/0/ports/-
  value:
    name: localapi
    containerPort: 9090
    protocol: TCP
# Config console (plain HTTP, no auth) — exposed via the agent-console NodePort
# Service so an operator can set policy/region/workload from a browser.
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --console-bind-address=:9095
- op: add
  path: /spec/template/spec/containers/0/ports/-
  value:
    name: console
    containerPort: 9095
    protocol: TCP
# ConsumerChoice LLM, from agent-config (config/agent/base/configmap.yaml). An
# empty ollamaUrl leaves --ollama-url empty, which disables the LLM.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: OLLAMA_URL
    valueFrom:
      configMapKeyRef:
        name: agent-config
        key: ollamaUrl
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: OLLAMA_MODEL
    valueFrom:
      configMapKeyRef:
        name: agent-config
        key: ollamaModel
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: OLLAMA_TIMEOUT
    valueFrom:
      configMapKeyRef:
        name: agent-config
        key: ollamaTimeout
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --ollama-url=$(OLLAMA_URL)
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --ollama-model=$(OLLAMA_MODEL)
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --ollama-timeout=$(OLLAMA_TIMEOUT)
