# Provider-role overlay patch for the agent container.
#
# 1. Append --role=provider.
# 2. Append --price-file pointing at the mounted prices ConfigMap, and mount it.
#    The agent re-reads this file every advertisement cycle so an operator can
#    reprice without a restart. The ConfigMap is optional and ships empty, so a
#    provider with no prices set behaves exactly as before (advertises no price).
# 3. Append --capacity-file pointing at the mounted capacity ConfigMap, and mount
#    it. Same re-read-every-cycle semantics; ships empty so a provider with no
#    cap set advertises its full allocatable exactly as before.
# 4. Append --mock-eco-url and --eco-cache-ttl (provider-only) for the eco
#    strategy; the region file and --mock-geo-url come from the base. Empty
#    URL ⇒ advertise no carbon.
# 5. Append --catalog-addr from agent-config (key catalogAddr). When set, the
#    agent writes this provider's own offer to that Redis catalog after every
#    accepted advertisement; empty (the default) writes nothing.
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --mock-eco-url=$(MOCK_ECO_URL)
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --eco-cache-ttl=$(ECO_CACHE_TTL)
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --role=provider
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --price-file=/etc/federation-autoscaler/prices/prices.yaml
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --capacity-file=/etc/federation-autoscaler/capacity/capacity.yaml
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --renewable-file=/etc/federation-autoscaler/renewable/renewable.yaml
# Advertise the udpecho probe endpoint <nodeIP>:<port> for the measured-latency
# strategy. This port MUST match the nodePort of the agent-probe Service in
# udpecho.yaml (30100) — the consumer probes <advertised nodeIP>:30100.
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --probe-udp-port=30100
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: prices
    mountPath: /etc/federation-autoscaler/prices
    readOnly: true
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: capacity
    mountPath: /etc/federation-autoscaler/capacity
    readOnly: true
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: renewable
    mountPath: /etc/federation-autoscaler/renewable
    readOnly: true
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: prices
    configMap:
      name: agent-prices
      optional: true
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: capacity
    configMap:
      name: agent-capacity
      optional: true
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: renewable
    configMap:
      name: agent-renewable
      optional: true
# Config console (plain HTTP, no auth) — exposed via the agent-console NodePort
# Service so an operator can set prices/region/capacity from a browser. This is
# the provider role's only HTTP server.
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --console-bind-address=:9095
- op: add
  path: /spec/template/spec/containers/0/ports/-
  value:
    name: console
    containerPort: 9095
    protocol: TCP
# Catalog write (optional): catalogAddr from agent-config is the Redis catalog
# this provider writes its own offer to after every accepted advertisement.
# Empty (the default) means the provider writes no offer, exactly as before.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: CATALOG_ADDR
    valueFrom:
      configMapKeyRef:
        name: agent-config
        key: catalogAddr
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --catalog-addr=$(CATALOG_ADDR)
# Local AI for the console's offer panel (an offer written in plain words
# becomes the settings), from agent-config. An empty ollamaUrl leaves
# --ollama-url empty: the panel then reads the text with fixed patterns.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: OLLAMA_URL
    valueFrom:
      configMapKeyRef:
        name: agent-config
        key: ollamaUrl
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: OLLAMA_MODEL
    valueFrom:
      configMapKeyRef:
        name: agent-config
        key: ollamaModel
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: LLM_API
    valueFrom:
      configMapKeyRef:
        name: agent-config
        key: llmApi
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --ollama-url=$(OLLAMA_URL)
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --ollama-model=$(OLLAMA_MODEL)
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --llm-api=$(LLM_API)
