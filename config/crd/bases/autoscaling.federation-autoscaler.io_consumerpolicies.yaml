---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: consumerpolicies.autoscaling.federation-autoscaler.io
spec:
  group: autoscaling.federation-autoscaler.io
  names:
    kind: ConsumerPolicy
    listKind: ConsumerPolicyList
    plural: consumerpolicies
    shortNames:
    - cpolicy
    singular: consumerpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.placement.type
      name: Placement
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ConsumerPolicy is a consumer-cluster-local declaration of how the Broker
          should place this consumer's borrowed capacity (e.g. prefer the cheapest
          providers). It lives only on the consumer cluster; the Broker never reads it
          directly — the Consumer Agent pushes its spec on the heartbeat, preserving
          the agent-initiated (no Broker→cluster dial-in) communication model.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired placement policy.
            properties:
              latencyBound:
                description: |-
                  LatencyBound limits the providers the consumer-side brain may choose to
                  those within a latency bound of a reference point, e.g. "max 3 ms from
                  Asti". The brain filters out providers outside the bound, then ranks the
                  rest with Placement. Used only when the brain runs on the consumer
                  (local mode); the central Broker ignores it. A ResourceRequest may
                  override it per request.
                properties:
                  from:
                    description: |-
                      From is the reference point the bound is measured from. Empty means the
                      consumer cluster's own location.
                    properties:
                      latitude:
                        description: Latitude in decimal degrees.
                        maximum: 90
                        minimum: -90
                        type: number
                      longitude:
                        description: Longitude in decimal degrees.
                        maximum: 180
                        minimum: -180
                        type: number
                      name:
                        description: Name is a human-readable label for the point
                          (e.g. "Asti"); informational.
                        type: string
                    required:
                    - latitude
                    - longitude
                    type: object
                  maxLatencyMs:
                    description: MaxLatencyMs is the bound, in milliseconds.
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - maxLatencyMs
                type: object
              placement:
                description: |-
                  Placement is the resource-placement policy the Broker applies to this
                  consumer's requests.
                properties:
                  type:
                    description: |-
                      Type selects the placement strategy. Empty means the Broker default — the
                      "Standard" composite (balance free capacity, prefer renewable). Supported
                      values are "Standard", "Price" (cheapest), "Eco" (lowest carbon),
                      "Latency" (closest), "ConsumerChoice" (a local LLM chooses from the
                      user's natural-language request), and "Random".
                    enum:
                    - Standard
                    - Price
                    - Eco
                    - Latency
                    - ConsumerChoice
                    - Random
                    type: string
                type: object
              userPrompt:
                description: |-
                  UserPrompt is the natural-language selection request used by the
                  ConsumerChoice strategy. The Consumer Agent passes it alongside the
                  provider list to a local LLM (e.g. Ollama) which interprets it and
                  selects a single provider. Ignored for other strategies. Example:
                  "I want the cheapest provider that is also reasonably green".
                  Re-read every heartbeat so changes take effect without a restart.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
